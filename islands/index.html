<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="data:," />
  <title>BIM Islands — 題目挑戰</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a1628;
      font-family: "Noto Sans TC", "PingFang HK", "Microsoft JhengHei",
                   "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #canvas-wrap {
      position: fixed;
      inset: 0;
      background: #0a1628;
    }
    canvas { display: block; width: 100%; height: 100%; }

    /* HUD hint — white text */
    #hint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      color: #f5f7fa;
      font-size: 13px;
      letter-spacing: 0.04em;
      opacity: 0.78;
      pointer-events: none;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.55);
      white-space: normal;
      text-align: center;
      max-width: min(520px, calc(100vw - 40px));
      line-height: 1.55;
      user-select: none;
    }

    /* Dark glass popup — white titles & body */
    #popup {
      position: fixed;
      top: 48px;
      left: 50%;
      transform: translateX(-50%) translateY(-12px);
      z-index: 20;
      width: min(420px, calc(100vw - 32px));
      padding: 22px 24px 20px;
      border-radius: 14px;
      background: rgba(12, 22, 40, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.45),
        0 0 0 1px rgba(255, 255, 255, 0.04) inset;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.22s ease, transform 0.22s ease, visibility 0.22s;
      pointer-events: none;
    }
    #popup.open {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }
    #popup::before {
      content: "";
      position: absolute;
      top: 0;
      left: 18px;
      right: 18px;
      height: 3px;
      border-radius: 0 0 3px 3px;
      background: var(--accent, #4ecdc4);
    }
    #popup .close {
      position: absolute;
      top: 12px;
      right: 14px;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #f5f7fa;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    #popup .close:hover {
      background: rgba(255, 255, 255, 0.16);
    }
    #popup h2 {
      color: #ffffff;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin: 0 28px 12px 0;
      line-height: 1.35;
    }
    #popup p {
      color: #f5f7fa;
      font-size: 14px;
      line-height: 1.7;
      margin: 0;
      opacity: 0.92;
    }

    #popup.accent-a { --accent: #4ecdc4; }
    #popup.accent-b { --accent: #f0a04b; }
    #popup.accent-t { --accent: #f5c542; }
      #hint { bottom: 118px; }
    #nav {
      position: fixed;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      z-index: 15;
      width: min(640px, calc(100vw - 20px));
      padding: 10px 12px 12px;
      border-radius: 14px;
      background: rgba(12, 22, 40, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      color: #f5f7fa;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    #nav-name {
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: 0.03em;
    }
    #nav-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      flex-wrap: wrap;
    }
    #nav button {
      min-width: 34px;
      height: 34px;
      padding: 0 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.06);
      color: #f5f7fa;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    #nav button:hover { background: rgba(255, 255, 255, 0.14); }
    #nav button.active {
      background: rgba(78, 205, 196, 0.28);
      border-color: #4ecdc4;
      color: #ffffff;
      font-weight: 600;
    }
    #nav button.arrow { font-size: 16px; }

    /* ---- isl3 HUD / quiz / 本機排行 (DOM only, no 3D text) ---- */
    #hud {
      position: fixed;
      top: 8px;
      left: 8px;
      right: 8px;
      z-index: 18;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      pointer-events: none;
    }
    #hud > * { pointer-events: auto; }
    .hud-glass {
      background: rgba(12, 22, 40, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      border-radius: 12px;
      color: #f5f7fa;
      font-family: inherit;
    }
    #hud-name {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
    }
    #hud-name label {
      font-size: 12px;
      opacity: 0.8;
      white-space: nowrap;
    }
    #hud-name input {
      width: 7.5em;
      max-width: 28vw;
      height: 28px;
      padding: 0 8px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }
    #hud-name input:focus { border-color: #4ecdc4; }
    #hud-score {
      margin-left: auto;
      padding: 6px 12px;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    #hud-score b { color: #4ecdc4; font-weight: 600; }
    #btn-board {
      height: 32px;
      padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: #f5f7fa;
      font-size: 13px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    #btn-board:hover { background: rgba(255, 255, 255, 0.14); }
    #nav-head {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    #nav-name { margin-bottom: 0; }
    #btn-quiz {
      height: 32px;
      padding: 0 14px;
      border: 1px solid #4ecdc4;
      border-radius: 9px;
      background: rgba(78, 205, 196, 0.28);
      color: #ffffff;
      font-size: 14px;
      font-family: inherit;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
    }
    #btn-quiz:hover { background: rgba(78, 205, 196, 0.42); }
    #btn-quiz.done {
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
      font-weight: 600;
    }

    #quiz, #board {
      position: fixed;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      z-index: 26;
      width: min(440px, calc(100vw - 20px));
      max-height: calc(100dvh - 108px - 148px);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      padding: 20px 20px 18px;
      border-radius: 14px;
      background: rgba(12, 22, 40, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
      color: #f5f7fa;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.22s ease, transform 0.22s ease, visibility 0.22s;
      pointer-events: none;
    }
    #quiz { top: 100px; --accent: #4ecdc4; }
    #board { top: 100px; z-index: 28; --accent: #f0a04b; }
    #quiz.open, #board.open {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }
    #quiz::before, #board::before {
      content: "";
      position: absolute;
      top: 0; left: 18px; right: 18px;
      height: 3px;
      border-radius: 0 0 3px 3px;
      background: var(--accent, #4ecdc4);
    }
    #quiz .close, #board .close {
      position: absolute;
      top: 10px; right: 12px;
      width: 28px; height: 28px;
      border: none; border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #f5f7fa;
      font-size: 18px; line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #quiz h2, #board h2 {
      color: #ffffff;
      font-size: 17px;
      font-weight: 600;
      margin: 0 28px 4px 0;
      line-height: 1.35;
    }
    #quiz .theme {
      color: #4ecdc4;
      font-size: 12px;
      letter-spacing: 0.06em;
      margin: 0 0 8px;
      font-weight: 600;
    }
    #quiz .blurb, #board .note {
      color: #f5f7fa;
      font-size: 13px;
      line-height: 1.65;
      opacity: 0.88;
      margin: 0 0 12px;
    }
    #quiz .prompt {
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.55;
      margin: 0 0 10px;
    }
    #quiz .choices { display: flex; flex-direction: column; gap: 7px; }
    #quiz .choices button {
      text-align: left;
      width: 100%;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: #f5f7fa;
      font-size: 13.5px;
      line-height: 1.5;
      font-family: inherit;
      cursor: pointer;
    }
    #quiz .choices button:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.12);
    }
    #quiz .choices button .tag {
      display: inline-block;
      width: 1.4em;
      font-weight: 700;
      color: #4ecdc4;
    }
    #quiz .choices button.correct {
      border-color: #4ecdc4;
      background: rgba(78, 205, 196, 0.22);
    }
    #quiz .choices button.wrong {
      border-color: #e07a7a;
      background: rgba(224, 122, 122, 0.18);
    }
    #quiz .feedback {
      display: none;
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13.5px;
      line-height: 1.65;
    }
    #quiz .feedback.show { display: block; }
    #quiz .feedback.ok {
      background: rgba(78, 205, 196, 0.16);
      border: 1px solid rgba(78, 205, 196, 0.45);
    }
    #quiz .feedback.bad {
      background: rgba(224, 122, 122, 0.14);
      border: 1px solid rgba(224, 122, 122, 0.4);
    }
    #quiz .summary {
      display: none;
      margin-top: 10px;
      font-size: 14px;
      line-height: 1.7;
    }
    #quiz .summary.show { display: block; }
    #quiz .next-hint {
      display: none;
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.75;
    }
    #quiz .next-hint.show { display: block; }
    #board table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    #board th, #board td {
      text-align: left;
      padding: 7px 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    #board th { color: rgba(245, 247, 250, 0.7); font-weight: 600; font-size: 11px; letter-spacing: 0.04em; }
    #board td.num, #board th.num { text-align: right; }
    #board .empty { opacity: 0.7; font-size: 13px; padding: 8px 0; }
    #popup { top: 100px; }

    @media (max-width: 480px) {
      #hud { top: 6px; left: 6px; right: 6px; gap: 5px; }
      #hud-name { padding: 4px 8px; }
      #hud-name input { width: 5.8em; max-width: 26vw; height: 26px; }
      #hud-score { font-size: 11px; padding: 6px 6px; margin-left: auto; }
      #btn-board { height: 30px; padding: 0 8px; font-size: 12px; flex-shrink: 0; }
      #quiz, #board, #popup { top: 52px; max-height: calc(100dvh - 52px - 156px); }
      #hint { bottom: 148px; }
      #btn-quiz { height: 30px; padding: 0 10px; font-size: 13px; }
    }
    @media (max-width: 480px) {
      #nav button { min-width: 30px; height: 32px; padding: 0 6px; font-size: 13px; }
      #hint { bottom: 132px; font-size: 12px; }
      #popup { top: 16px; }
    }
  </style>
</head>
<body>
  <div id="canvas-wrap"></div>
  <div id="hint"></div>

  <div id="hud">
    <div id="hud-name" class="hud-glass">
      <label for="player-name">名稱</label>
      <input id="player-name" type="text" maxlength="12" placeholder="輸入名稱" autocomplete="off" enterkeyhint="done" />
    </div>
    <div id="hud-score" class="hud-glass">分數 <b id="score-val">0</b>/100 · 已完成 <b id="done-val">0</b>/10</div>
    <button type="button" id="btn-board" class="hud-glass" aria-label="本機排行">本機排行</button>
  </div>
  <div id="quiz" role="dialog" aria-modal="true" aria-labelledby="quiz-title">
    <button class="close" type="button" aria-label="關閉">×</button>
    <h2 id="quiz-title"></h2>
    <div class="theme" id="quiz-theme"></div>
    <p class="blurb" id="quiz-blurb"></p>
    <p class="prompt" id="quiz-prompt"></p>
    <div class="choices" id="quiz-choices"></div>
    <div class="feedback" id="quiz-feedback"></div>
    <div class="next-hint" id="quiz-next"></div>
    <div class="summary" id="quiz-summary"></div>
  </div>
  <div id="board" role="dialog" aria-modal="true" aria-labelledby="board-title">
    <button class="close" type="button" aria-label="關閉">×</button>
    <h2 id="board-title">本機排行</h2>
    <p class="note">只限呢部裝置（同一瀏覽器的 localStorage），唔會上網同步。</p>
    <div id="board-body"></div>
  </div>
  <div id="popup" role="dialog" aria-modal="true" aria-labelledby="popup-title">
    <button class="close" type="button" aria-label="關閉">×</button>
    <h2 id="popup-title"></h2>
    <p id="popup-body"></p>
  </div>
  <div id="nav">
    <div id="nav-head">
      <div id="nav-name" >島嶼 1</div>
      <button type="button" id="btn-quiz">題目</button>
    </div>
    <div id="nav-row">
      <button class="arrow" id="prev" type="button" aria-label="上一個島">‹</button>
      <span id="nav-nums" style="display:contents"></span>
      <button class="arrow" id="next" type="button" aria-label="下一個島">›</button>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    console.info('isl3');

    // Island 1 copy — unchanged from original
    const COPY = {
      A: {
        title: 'MEP 碰撞檢測',
        body: '施工前用 BIM 三維模型，自動檢查機電管線同結構、建築有冇撞位。提早搵到交叉、淨高唔夠或安裝位唔夠，減少現場返工同延誤，跨專業協調更快更準。',
        accent: '#4ecdc4',
      },
      B: {
        title: '施工模擬／4D',
        body: '把 3D 模型同工期計劃一齊播，預先睇清工序銜接、吊運路徑同資源點擺。早發現時序衝突同安全隱患，計劃更穩，跨專業溝通同決策都更清楚。',
        accent: '#f0a04b',
      },
      T: {
        title: '你找到了 BIM 機電零件！',
        body: '你找到了 BIM 機電零件！',

      },
    };
    const HINT_1 = '撳建築睇引言・撳金色「題」柱或下面「題目」掣作答（每島一題，答對 10 分）。鍵盤 Q 都開得到。';
    const HINT_N = '撳建築睇引言・撳金色「題」柱或「題目」掣作答・答完會自動飛去下一島';

    // =====================================================================
    // QUIZ + ISLAND COPY  (from island-quiz-popup-copy.md; 引言易換)

    // 畫面作答前唔顯示官方答案標記。排行榜只存 localStorage。
    // =====================================================================
    const QUIZ = [
  {
    "id": 1,
    "copyName": "原本 BIM 島",
    "theme": "BIM 基礎",
    "intro": "BIM 用帶資料嘅三維模型，把建築、結構、機電資訊集中管理，由設計、施工用到營運。唔只睇外形，仲可查尺寸、材料同系統，跨專業共用更清楚。",

    "correct": 1,
    "ok": "啱！一般 3D 模型主要表達外形；BIM 嘅元件仲帶有尺寸、材料、系統等資料，可以查詢同跨專業共用。",
    "bad": "唔係畫面精唔精美。一般 3D 主要表達外形；BIM 嘅價值在於元件帶有可查詢、可共用嘅工程資料。"
  },
  {
    "id": 2,
    "copyName": "長脊",
    "theme": "LOD（詳細程度）",
    "intro": "LOD 說明模型喺某個階段應做到幾仔細、資料有幾可靠，避免過早做過細，或完工時資料唔夠。團隊先約定標準，分工、審查同交接先唔會各說各話。",

  {

    "qid": "3-1",
    "prompt": "碰撞檢測主要想搵出咩問題？",
    "choices": [
      "預算有冇超支",
      "管線、結構或建築元件喺空間上互相干擾",
      "工人出勤率",
      "外牆顏色配搭"
    ],
    "correct": 1,
    "ok": "啱！例如風管穿過樑、喉管撞升降機槽，都屬立體空間衝突，應喺施工前用模型及早發現。",
    "bad": "碰撞檢測要搵嘅係空間衝突：管線、結構或建築元件互相干擾，而唔係預算、出勤或顏色問題。"
  },
  {
    "id": 4,

    const closeBtn = popupEl.querySelector('.close');
    function islandIndexForBuilding(id) {
      if (id === 'A' || id === 'B' || id === 'T') return 0;
      const m = String(id || '').match(/^(\d+)-/);
      return m ? (parseInt(m[1], 10) - 1) : null;
    }
    function showPopup(id) {
      if (id === 'T') {
        const c = COPY.T;
        titleEl.textContent = c.title;
        bodyEl.textContent = c.body;
        popupEl.style.setProperty('--accent', c.accent);
        popupEl.classList.remove('accent-a', 'accent-b', 'accent-t');
        popupEl.classList.add('accent-t', 'open');
        return;
      }
      const idx = islandIndexForBuilding(id);
      const meta = idx != null ? QUIZ[idx] : null;
      if (!meta) {
        const c = COPY[id];
        if (!c) return;
        titleEl.textContent = c.title;
        bodyEl.textContent = c.body;
        popupEl.style.setProperty('--accent', c.accent);
        popupEl.classList.add('open');
        return;
      }
      // 引言（內容設計師文案；之後可只改 QUIZ[i].intro）
      titleEl.textContent = islands[idx].name + ' — ' + meta.theme;
      bodyEl.textContent = meta.intro;
      popupEl.style.setProperty('--accent', QUIZ_ACCENT[idx]);
      popupEl.classList.remove('accent-a', 'accent-b', 'accent-t');
      popupEl.classList.add('open');
    }
    function hidePopup() { popupEl.classList.remove('open'); }
    closeBtn.addEventListener('click', (e) => { e.stopPropagation(); hidePopup(); });
    window.addEventListener('keydown', (e) => {
      const typing = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');
      if (e.key === 'Escape') { hidePopup(); hideQuiz(); hideBoard(); }
      if (typing) return;
      if (e.key === 'ArrowRight') go(current + 1);
      if (e.key === 'ArrowLeft') go(current - 1);
      if (e.key === 'q' || e.key === 'Q') openQuiz(current);
    });

    // --- Navigation ---
    const hintEl = document.getElementById('hint');
    const nameEl = document.getElementById('nav-name');
    const numsEl = document.getElementById('nav-nums');
    const numBtns = islands.map((rec, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = String(i + 1);
      b.setAttribute('aria-label', rec.name);
      b.addEventListener('click', () => go(i));
      numsEl.appendChild(b);
      return b;
    });
    document.getElementById('prev').addEventListener('click', () => go(current - 1));
    document.getElementById('next').addEventListener('click', () => go(current + 1));

    let current = 0;
    let fly = null;
    function updateUi() {
      numBtns.forEach((b, i) => b.classList.toggle('active', i === current));
      nameEl.textContent = islands[current].name;
      hintEl.textContent = current === 0 ? HINT_1 : HINT_N;
      if (typeof refreshHud === 'function') refreshHud();
    }
    function go(i) {
      const n = islands.length;
      i = ((i % n) + n) % n;
      current = i;
      hidePopup();
      if (!pendingQuizAfterFly) hideQuiz();
      updateUi();
      const rec = islands[i];
      const toTarget = rec.base.clone().add(new THREE.Vector3(0, rec.view.ty, 0));
      // keep the current viewing direction if reasonable, else default offset
      const toPos = toTarget.clone().add(rec.view.off.clone().multiplyScalar(fitFactor()));
      fly = {
        t0: performance.now(), dur: 1400,
        fromPos: camera.position.clone(), fromTgt: controls.target.clone(),
        toPos, toTgt: toTarget,
        lift: Math.min(8, camera.position.distanceTo(toPos) * 0.15),
      };
      controls.enabled = false;
    }
    function fitFactor() {
      const a = window.innerWidth / window.innerHeight;
      return a >= 1 ? 1 : Math.min(2.2, Math.max(1, 1.2 / a));
    }
    // initial framing of island 1 (wider on portrait phones)
    camera.position.copy(controls.target).add(islands[0].view.off.clone().multiplyScalar(fitFactor()));
    controls.update();
    const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

    // --- Raycasting (tap, not drag) ---
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let pointerDown = null;
    function setPointer(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      const cx = event.clientX ?? (event.touches && event.touches[0]?.clientX);
      const cy = event.clientY ?? (event.touches && event.touches[0]?.clientY);
      if (cx == null) return false;
      pointer.x = ((cx - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((cy - rect.top) / rect.height) * 2 + 1;
      return true;
    }
    function pick() {
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(pickables, true);
      for (const h of hits) {
        if (h.object.material === shadowMat) continue;
        let o = h.object, bid = null, idx = null;
        let qid = null;
        while (o) {
          if (bid == null && o.userData && o.userData.buildingId) bid = o.userData.buildingId;
          if (qid == null && o.userData && o.userData.quizIsland != null) qid = o.userData.quizIsland;
          if (o.userData && o.userData.islandIndex != null) { idx = o.userData.islandIndex; break; }
          o = o.parent;
        }
        if (idx != null) return { bid, idx, qid };
      }
      return null;
    }
    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (!setPointer(e)) return;
      pointerDown = { x: pointer.x, y: pointer.y, t: performance.now() };
    });
    renderer.domElement.addEventListener('pointerup', (e) => {
      if (!pointerDown) return;
      if (!setPointer(e)) { pointerDown = null; return; }
      const moved = Math.hypot(pointer.x - pointerDown.x, pointer.y - pointerDown.y) > 0.02;
      const quick = performance.now() - pointerDown.t < 450;
      pointerDown = null;
      if (moved || !quick) return;
      const hit = pick();
      if (!hit) { hidePopup(); return; }
      if (hit.idx !== current) { go(hit.idx); return; }
      if (hit.qid != null) { openQuiz(hit.qid); return; }
      if (hit.bid) showPopup(hit.bid); else { hidePopup(); /* tapping the island itself also shows 引言 */ showPopup(String(current + 1) + '-1'); }
    });

    // --- Resize ---
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- Island 1 building lean (original parallax, mouse only) ---
    const leanTarget = { x: 0, z: 0 };
    const leanCurrent = { x: 0, z: 0 };
    renderer.domElement.addEventListener('pointermove', (e) => {
      if (e.pointerType !== 'mouse') return;
      const rect = renderer.domElement.getBoundingClientRect();
      const nx = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      const ny = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      leanTarget.x = ny * 0.12;
      leanTarget.z = -nx * 0.16;
    });
    renderer.domElement.addEventListener('pointerleave', () => { leanTarget.x = 0; leanTarget.z = 0; });

    // --- Animate ---
    updateUi();
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      for (const rec of islands) {
        const b = rec.bob;
        rec.group.position.y = rec.base.y + Math.sin(t * b.spd + b.ph) * b.amp;
        rec.group.rotation.y = Math.sin(t * 0.12 + b.ph) * 0.025;
        const sats = rec.group.userData.sats;
        if (sats) for (const s of sats) s.position.y = s.userData.sat.base + Math.sin(t * 0.8 + s.userData.sat.ph) * 0.22;
      }

      leanCurrent.x += (leanTarget.x - leanCurrent.x) * 0.08;
      leanCurrent.z += (leanTarget.z - leanCurrent.z) * 0.08;
      for (const b of island1Buildings) { b.rotation.x = leanCurrent.x; b.rotation.z = leanCurrent.z; }

      stars.rotation.y = t * 0.004;
      stars.material.opacity = 0.72 + Math.sin(t * 1.4) * 0.1 + Math.sin(t * 2.7) * 0.06;

      if (treasure.userData.glowLight) {
        treasure.userData.glowLight.intensity = 0.45 + Math.sin(t * 2.2) * 0.22;
        for (const m of treasure.userData.goldMats) m.emissiveIntensity = 0.35 + Math.sin(t * 2.2) * 0.2;
        treasure.rotation.z = 0.25 + Math.sin(t * 0.9) * 0.08;
      }
      quizGemMat.emissiveIntensity = 0.55 + Math.sin(t * 2.4) * 0.3;
      for (const g of quizMarkers) {
        const gem = g.children[2];
        if (gem) gem.rotation.y = t * 1.2;
      }

      if (fly) {
        const k = Math.min(1, (performance.now() - fly.t0) / fly.dur);
        const e = ease(k);
        camera.position.lerpVectors(fly.fromPos, fly.toPos, e);
        camera.position.y += Math.sin(Math.PI * e) * fly.lift;
        controls.target.lerpVectors(fly.fromTgt, fly.toTgt, e);
        camera.lookAt(controls.target);
        if (k >= 1) { fly = null; controls.enabled = true; controls.update(); if (pendingQuizAfterFly != null) { const n = pendingQuizAfterFly; pendingQuizAfterFly = null; openQuiz(n); } }
      } else {
        controls.update();
      }
      renderer.render(scene, camera);
    }
    animate();

    // ----- Name, score, 本機排行, quiz flow -----
    let pendingQuizAfterFly = null;
    let autoAdvanceTimer = 0;
    const nameInput = document.getElementById('player-name');
    const scoreVal = document.getElementById('score-val');
    const doneVal = document.getElementById('done-val');
    const quizEl = document.getElementById('quiz');
    const boardEl = document.getElementById('board');
    const quizTitle = document.getElementById('quiz-title');
    const quizTheme = document.getElementById('quiz-theme');
    const quizBlurb = document.getElementById('quiz-blurb');
    const quizPrompt = document.getElementById('quiz-prompt');
    const quizChoices = document.getElementById('quiz-choices');
    const quizFeedback = document.getElementById('quiz-feedback');
    const quizNext = document.getElementById('quiz-next');
    const quizSummary = document.getElementById('quiz-summary');
    const btnQuiz = document.getElementById('btn-quiz');
    const btnBoard = document.getElementById('btn-board');
    let quizOpenFor = null;

    function loadProgress() {
      try { return JSON.parse(localStorage.getItem(LS_PROGRESS) || '{}') || {}; } catch { return {}; }
    }
    function saveProgress(p) {
      try { localStorage.setItem(LS_PROGRESS, JSON.stringify(p)); } catch {}
    }
    function loadBoard() {
      try { return JSON.parse(localStorage.getItem(LS_BOARD) || '[]') || []; } catch { return []; }
    }
    function saveBoard(rows) {
      try { localStorage.setItem(LS_BOARD, JSON.stringify(rows)); } catch {}
    }
    function playerName() {
      const n = (nameInput.value || '').trim();
      return n || '玩家';
    }
    function progressStats(p) {
      const answers = p.answers || {};
      let score = 0, done = 0;
      for (let i = 0; i < 10; i++) {
        const a = answers[String(i)];
        if (a && a.answered) {
          done += 1;
          if (a.correct) score += SCORE_PER;
        }
      }
      return { score, done };
    }
    function refreshHud() {
      if (!quizHudReady) return;
      const { score, done } = progressStats(loadProgress());
      scoreVal.textContent = String(score);
      doneVal.textContent = String(done);
      const p = loadProgress();
      const a = p.answers && p.answers[String(current)];
      btnQuiz.classList.toggle('done', !!(a && a.answered));
      btnQuiz.textContent = (a && a.answered) ? '題目 ✓' : '題目';
    }
    function upsertBoard() {
      const name = playerName();
      const { score, done } = progressStats(loadProgress());
      if (done === 0) return;
      let rows = loadBoard().filter((r) => r && r.name !== name);
      rows.push({ name, score, completed: done, ts: Date.now() });
      rows.sort((a, b) => (b.score - a.score) || (b.completed - a.completed) || (a.ts - b.ts));
      rows = rows.slice(0, BOARD_MAX);
      saveBoard(rows);
    }
    function renderBoard() {
      const rows = loadBoard();
      const body = document.getElementById('board-body');
      if (!rows.length) {
        body.innerHTML = '<p class="empty">暫時未有紀錄。完成至少一島題目後就會寫入本機排行。</p>';
        return;
      }
      let html = '<table><thead><tr><th>名次</th><th>名稱</th><th class="num">總分</th><th class="num">已完成島</th></tr></thead><tbody>';
      rows.forEach((r, i) => {
        html += `<tr><td>${i + 1}</td><td>${escapeHtml(r.name)}</td><td class="num">${r.score}/100</td><td class="num">${r.completed}/10</td></tr>`;
      });
      html += '</tbody></table>';
      body.innerHTML = html;
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function hideQuiz() {
      quizEl.classList.remove('open');
      quizOpenFor = null;
      if (autoAdvanceTimer) { clearTimeout(autoAdvanceTimer); autoAdvanceTimer = 0; }
    }
    function hideBoard() { boardEl.classList.remove('open'); }
    function showBoard() {
      hideQuiz();
      renderBoard();
      boardEl.classList.add('open');
    }
    function openQuiz(idx) {
      if (idx == null || !QUIZ[idx]) return;
      if (idx !== current) {
        pendingQuizAfterFly = idx;
        go(idx);
        return;
      }
      hidePopup();
      hideBoard();
      const meta = QUIZ[idx];
      quizOpenFor = idx;
      quizEl.style.setProperty('--accent', QUIZ_ACCENT[idx]);
      quizTitle.textContent = islands[idx].name;
      quizTheme.textContent = '主題：' + meta.theme;
      quizBlurb.textContent = meta.intro;
      quizPrompt.textContent = meta.prompt;
      quizFeedback.className = 'feedback';
      quizFeedback.textContent = '';
      quizNext.className = 'next-hint';
      quizNext.textContent = '';
      quizSummary.className = 'summary';
      quizSummary.textContent = '';
      quizChoices.innerHTML = '';
      const p = loadProgress();
      const prev = (p.answers || {})[String(idx)];
      const locked = !!(prev && prev.answered);
      meta.choices.forEach((text, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.innerHTML = '<span class="tag">' + String.fromCharCode(65 + i) + '.</span> ' + escapeHtml(text);
        if (locked) {
          b.disabled = true;
          if (i === prev.choice) b.classList.add(prev.correct ? 'correct' : 'wrong');
          if (!prev.correct && i === meta.correct) b.classList.add('correct');
        } else {
          b.addEventListener('click', () => answerQuiz(idx, i));
        }
        quizChoices.appendChild(b);
      });
      if (locked) {
        showFeedback(idx, prev.correct, false);
      }
      quizEl.classList.add('open');
    }
    function showFeedback(idx, correct, willAdvance) {
      const meta = QUIZ[idx];
      quizFeedback.className = 'feedback show ' + (correct ? 'ok' : 'bad');
      quizFeedback.textContent = correct ? meta.ok : meta.bad;
      const { score, done } = progressStats(loadProgress());
      quizSummary.className = 'summary show';
      quizSummary.textContent = (correct ? '本島得分 10/10' : '本島得分 0/10') + '　目前總分 ' + score + '/100　已完成 ' + done + '/10';
      if (willAdvance) {
        quizNext.className = 'next-hint show';
        quizNext.textContent = idx < 9 ? '稍後自動飛去下一島並打開題目…' : '稍後顯示總結同本機排行…';
      }
    }
    function answerQuiz(idx, choice) {
      const meta = QUIZ[idx];
      const p = loadProgress();
      if (!p.answers) p.answers = {};
      if (p.answers[String(idx)] && p.answers[String(idx)].answered) return;
      const correct = choice === meta.correct;
      p.answers[String(idx)] = { answered: true, choice, correct };
      saveProgress(p);
      upsertBoard();
      refreshHud();
      const btns = quizChoices.querySelectorAll('button');
      btns.forEach((b, i) => {
        b.disabled = true;
        if (i === choice) b.classList.add(correct ? 'correct' : 'wrong');
        if (!correct && i === meta.correct) b.classList.add('correct');
      });
      showFeedback(idx, correct, true);
      if (autoAdvanceTimer) clearTimeout(autoAdvanceTimer);
      autoAdvanceTimer = setTimeout(() => {
        autoAdvanceTimer = 0;
        if (idx < 9) {
          hideQuiz();
          pendingQuizAfterFly = idx + 1;
          go(idx + 1);
        } else {
          const { score, done } = progressStats(loadProgress());
          quizNext.className = 'next-hint show';
          quizNext.textContent = '';
          quizSummary.className = 'summary show';
          quizSummary.textContent = '十島題目已結束。總分 ' + score + '/100，已完成 ' + done + '/10。以下係本機排行。';
          showBoard();
        }
      }, 2600);
    }

    try { nameInput.value = localStorage.getItem(LS_NAME) || ''; } catch {}
    nameInput.addEventListener('change', () => {
      try { localStorage.setItem(LS_NAME, nameInput.value.trim()); } catch {}
      upsertBoard();
      refreshHud();
    });
    nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') nameInput.blur(); });
    btnQuiz.addEventListener('click', (e) => { e.stopPropagation(); openQuiz(current); });
    btnBoard.addEventListener('click', (e) => { e.stopPropagation(); if (boardEl.classList.contains('open')) hideBoard(); else showBoard(); });
    quizEl.querySelector('.close').addEventListener('click', (e) => { e.stopPropagation(); hideQuiz(); });
    boardEl.querySelector('.close').addEventListener('click', (e) => { e.stopPropagation(); hideBoard(); });

    quizHudReady = true;
    refreshHud();

    window.__islands = islands.length;
    window.__go = go;
    window.__openQuiz = openQuiz;
    window.__showIntro = (i) => { hideQuiz(); hideBoard(); showPopup(i === 0 ? 'A' : String(i + 1) + '-1'); };
    window.__openBoard = showBoard;
    window.__hideBoard = hideBoard;
    window.__answer = (i) => answerQuiz(quizOpenFor != null ? quizOpenFor : current, i);
    window.__info = () => ({ islands: islands.length, calls: renderer.info.render.calls, triangles: renderer.info.render.triangles, score: progressStats(loadProgress()) });

    window.__proj = (id) => {
      let found = null;
      scene.traverse((o) => { if (!found && o.isGroup && (o.userData.buildingId === id || o.name === id)) found = o; });
      if (!found) return null;
      const v = new THREE.Vector3(0, 0.5, 0); found.localToWorld(v); v.project(camera);
      return { x: (v.x + 1) / 2 * window.innerWidth, y: (1 - v.y) / 2 * window.innerHeight };
    };
  </script>
</body>
</html>
