      position: fixed;

      left: 0;
      right: 0;

      font-size: 13px;
      font-family: inherit;
      letter-spacing: 0.03em;
      cursor: pointer;

      box-shadow: 0 0 0 2px var(--accent, transparent) inset;

      transition: background 0.15s, border-color 0.15s, opacity 0.15s;

        palette: {

          { color: 0xe879a8, emissive: 0xffb0d0, storyTint: 0xb05078, x: 0.15, z: -0.15, w: 0.85, d: 0.85, h: 1.5, label: '版本管理' },

    // Fix typo if I accidentally left 0x8a9aac
    ISLANDS[1].buildings[1].color = 0x8a9aac;

    const RING = 15;
    for (let i = 0; i < ISLANDS.length; i++) {
      const a = (i / ISLANDS.length) * Math.PI * 2 - Math.PI / 2 - Math.PI / 10;
      const r = RING + (i % 3) * 1.4;
      ISLANDS[i].x = Math.cos(a) * r;
      ISLANDS[i].z = Math.sin(a) * r;
      ISLANDS[i].phase = i * 0.62;
    }

    // --- Shared geometries (never mutate; always clone before transform) ---
    const GEO = {
      box: new THREE.BoxGeometry(1, 1, 1),
      ico: new THREE.IcosahedronGeometry(1, 0),
      dod: new THREE.DodecahedronGeometry(1, 0),
      cyl8: new THREE.CylinderGeometry(1, 1, 1, 8),
      cyl6: new THREE.CylinderGeometry(1, 1, 1, 6),
      cone: new THREE.ConeGeometry(1, 1, 7),
      circle: new THREE.CircleGeometry(1, 20),
    };

    const _col = new THREE.Color();
    const _pos = new THREE.Vector3();
    const _quat = new THREE.Quaternion();
    const _scl = new THREE.Vector3();
    const _eul = new THREE.Euler();
    const _mat4 = new THREE.Matrix4();

    function colorize(srcGeo, hex, x, y, z, sx, sy, sz, rx = 0, ry = 0, rz = 0) {
      let g = srcGeo.clone();
      _pos.set(x, y, z);
      _eul.set(rx, ry, rz);
      _quat.setFromEuler(_eul);
      _scl.set(sx, sy, sz);
      _mat4.compose(_pos, _quat, _scl);
      g.applyMatrix4(_mat4);
      if (g.index) {
        const ni = g.toNonIndexed();
        g.dispose();
        g = ni;
      }
      g.deleteAttribute('uv');
      g.deleteAttribute('uv1');
      g.deleteAttribute('uv2');
      if (!g.attributes.normal) g.computeVertexNormals();
      _col.setHex(hex);
      const n = g.attributes.position.count;
      const arr = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) {
        arr[i * 3] = _col.r;
        arr[i * 3 + 1] = _col.g;
        arr[i * 3 + 2] = _col.b;
      }
      g.setAttribute('color', new THREE.BufferAttribute(arr, 3));
      return g;
    }

    function mergeAndDispose(list) {
      if (!list.length) return null;
      const merged = mergeGeometries(list, false);
      for (const g of list) g.dispose();
      return merged;
    }

    const terrainMat = new THREE.MeshStandardMaterial({

      metalness: 0.05,
      flatShading: true,
      vertexColors: true,

      transparent: true,
      opacity: 0.28,
      depthWrite: false,

    const goldMat = new THREE.MeshStandardMaterial({
      color: 0xd4a017,
      emissive: 0xf0a020,
      emissiveIntensity: 0.55,
      metalness: 0.85,
      roughness: 0.28,
      flatShading: true,

    const goldCoreMat = new THREE.MeshStandardMaterial({
      color: 0xb8860b,
      emissive: 0xffc040,
      emissiveIntensity: 0.35,
      metalness: 0.9,
      roughness: 0.25,

    function addRocksOriginal(p, terrain) {
      const { rock: r, rockDark: d } = p;
      const B = GEO.box, I = GEO.ico, D = GEO.dod;
      terrain.push(
        colorize(B, r, 0, 0.15, 0, 4.6, 1.1, 3.8, 0, 0.12, 0),
        colorize(B, d, -0.3, -0.55, 0.2, 3.8, 0.9, 3.2, 0.05, -0.2, 0.04),
        colorize(I, r, 1.8, -0.2, -0.9, 1.4, 1.1, 1.3, 0.3, 0.5, 0.1),
        colorize(I, d, -2.0, -0.35, 0.7, 1.5, 1.2, 1.4, 0.4, -0.8, 0.2),
        colorize(D, r, 0.6, -0.9, 1.4, 1.3, 1.0, 1.2, 0.2, 0.9, 0.15),
        colorize(D, d, -0.8, -1.0, -1.3, 1.4, 1.1, 1.3, 0.5, -0.4, 0.1),
        colorize(B, r, 2.2, 0.05, 0.8, 1.2, 0.8, 1.5, 0, 0.4, 0.08),

    function addBuilding(b, buildingGeos, windowGeos) {
      const { color, emissive, storyTint, x, z, w, d, h } = b;
      buildingGeos.push(colorize(GEO.box, color, x, 0.92 + h / 2, z, w, h, d));
      if (b.roof === 'slope') {
        buildingGeos.push(colorize(GEO.box, storyTint, x, 0.92 + h + 0.16, z, w * 1.12, 0.22, d * 1.12, 0, 0, 0.28));
      } else if (b.roof === 'dome') {
        buildingGeos.push(colorize(GEO.ico, storyTint, x, 0.92 + h + 0.28, z, w * 0.55, 0.45, d * 0.55));
      } else {
        buildingGeos.push(colorize(GEO.box, storyTint, x, 0.92 + h + 0.06, z, w * 1.08, 0.12, d * 1.08));
      }
      if (h > 2.2) {
        buildingGeos.push(colorize(GEO.cyl6, 0xcccccc, x, 0.92 + h + 0.35, z, 0.03, 0.45, 0.03));
      }
      const floors = Math.max(2, Math.min(5, Math.floor(h / 0.55)));
      for (let i = 0; i < floors; i++) {
        const wy = 0.92 + 0.35 + i * (h / floors);
        windowGeos.push(
          colorize(GEO.box, emissive, x, wy, z + d / 2 + 0.01, w * 0.72, 0.18, 0.04),
          colorize(GEO.box, emissive, x, wy, z - (d / 2 + 0.01), w * 0.72, 0.18, 0.04),
          colorize(GEO.box, emissive, x + w / 2 + 0.01, wy, z, 0.04, 0.18, d * 0.72),
          colorize(GEO.box, emissive, x - (w / 2 + 0.01), wy, z, 0.04, 0.18, d * 0.72),
        );
      }
    }

        colorize(GEO.box, 0xc0c8d0, 1.7, y0 + 3.15, -1.0, 0.12, 0.35, 0.12),
        colorize(GEO.box, 0xf0a04b, -0.2, y0 + 2.85, -1.0, 0.18, 0.25, 0.18),
      );
      windowGeos.push(colorize(GEO.box, 0xf0a04b, -0.2, y0 + 2.85, -1.0, 0.2, 0.2, 0.2));
    }

    function makeTreasure(group) {
      const g = new THREE.Group();
      g.name = 'treasure';
      g.userData.islandId = 'mep';
      const rim = new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.035, 8, 16), goldMat);
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.06, 8), goldCoreMat);
      hub.rotation.x = Math.PI / 2;
      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.14, 6), goldCoreMat);
      shaft.position.z = 0.08;
      shaft.rotation.x = Math.PI / 2;
      g.add(rim, hub, shaft);
      for (let i = 0; i < 6; i++) {
        const tooth = new THREE.Mesh(GEO.box, goldMat);
        const a = (i / 6) * Math.PI * 2;
        tooth.position.set(Math.cos(a) * 0.13, Math.sin(a) * 0.13, 0);
        tooth.rotation.z = a;
        tooth.scale.set(0.045, 0.05, 0.04);
        g.add(tooth);
      }
      g.position.set(-2.05, 1.02, 0.85);
      g.rotation.set(0.55, 0.8, 0.25);
      group.add(g);
      return g;
    }

    function buildIsland(cfg) {
      const group = new THREE.Group();
      group.name = cfg.id;
      group.userData.islandId = cfg.id;
      const terrain = [];
      const buildings = [];
      const windows = [];
      (SHAPE_FN[cfg.shape] || addRocksOriginal)(cfg.palette, terrain);
      for (const b of cfg.buildings) addBuilding(b, buildings, windows);
      if (cfg.extras === 'crane') addCrane(cfg, buildings, windows);

      const tGeo = mergeAndDispose(terrain);
      const bGeo = mergeAndDispose(buildings);
      const wGeo = mergeAndDispose(windows);
      if (tGeo) {
        const m = new THREE.Mesh(tGeo, terrainMat);
        m.userData.islandId = cfg.id;
        group.add(m);
      }
      if (bGeo) {
        const m = new THREE.Mesh(bGeo, buildingMat);
        m.userData.islandId = cfg.id;
        group.add(m);
      }
      if (wGeo) {
        const m = new THREE.Mesh(wGeo, windowMat);
        m.userData.islandId = cfg.id;
        group.add(m);
      }
      const shadow = new THREE.Mesh(GEO.circle, shadowMat);
      shadow.rotation.x = -Math.PI / 2;
      shadow.position.y = -2.4;
      shadow.scale.set(3.2, 3.2, 3.2);
      shadow.userData.islandId = cfg.id;
      group.add(shadow);

      group.position.set(cfg.x, 0, cfg.z);
      return group;
    }

    // --- Renderer ---
    const wrap = document.getElementById('canvas-wrap');
    const renderer = new THREE.WebGLRenderer({
      antialias: !IS_MOBILE,
      alpha: false,
      powerPreference: 'high-performance',
    });
    renderer.setPixelRatio(DPR);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x0a1628, 1);
    renderer.shadowMap.enabled = false;
    wrap.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a1628);
    scene.fog = new THREE.Fog(0x0a1628, 40, 140);

    const camera = new THREE.PerspectiveCamera(
      42,
      window.innerWidth / window.innerHeight,
      0.5,
      220
    );
    const OVERVIEW_POS = new THREE.Vector3(0, 54, 5);
    const OVERVIEW_TARGET = new THREE.Vector3(0, 0, 0);
    camera.position.copy(OVERVIEW_POS);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 6;
    controls.maxDistance = 90;
    controls.maxPolarAngle = Math.PI * 0.48;
    controls.minPolarAngle = Math.PI * 0.03;
    controls.target.copy(OVERVIEW_TARGET);
    controls.enablePan = false;
    controls.update();

    scene.add(new THREE.AmbientLight(0x6a8ab0, 0.62));
    const sun = new THREE.DirectionalLight(0xfff2dd, 1.15);
    sun.position.set(18, 36, 12);
    sun.castShadow = false;
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0x4a6a9a, 0.38);
    fill.position.set(-16, 14, -10);
    scene.add(fill);

    function makeSkyGradientTexture() {
      const c = document.createElement('canvas');
      c.width = 2;
      c.height = 256;
      const ctx = c.getContext('2d');
      const g = ctx.createLinearGradient(0, 0, 0, 256);
      g.addColorStop(0.0, '#050814');
      g.addColorStop(0.35, '#0a1630');
      g.addColorStop(0.62, '#1a1548');
      g.addColorStop(0.78, '#2a2458');
      g.addColorStop(0.88, '#3a2a4a');
      g.addColorStop(0.94, '#1e2848');
      g.addColorStop(1.0, '#0a1228');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 2, 256);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.magFilter = THREE.LinearFilter;
      tex.minFilter = THREE.LinearFilter;
      return tex;
    }

    const sky = new THREE.Mesh(
      new THREE.SphereGeometry(140, IS_MOBILE ? 16 : 24, IS_MOBILE ? 12 : 16),
      new THREE.MeshBasicMaterial({
        map: makeSkyGradientTexture(),
        side: THREE.BackSide,
        fog: false,
        depthWrite: false,
      })
    );
    scene.add(sky);

    const starCount = IS_MOBILE ? 280 : 560;
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount; i++) {
      const u = Math.random();
      const v = Math.random();
      const theta = u * Math.PI * 2;
      const phi = Math.acos(1 - v * 0.92);
      const r = 70 + Math.random() * 50;
      starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      starPos[i * 3 + 1] = Math.max(r * Math.cos(phi) - 4, -8);
      starPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    const stars = new THREE.Points(
      starGeo,
      new THREE.PointsMaterial({
        color: 0xdce8ff,
        size: 0.22,
        transparent: true,
        opacity: 0.85,
        depthWrite: false,
        sizeAttenuation: true,
        fog: false,
      })
    );
    scene.add(stars);

    const particleCount = IS_MOBILE ? 0 : 40;
    let particles = null;
    if (particleCount) {
      const pPos = new Float32Array(particleCount * 3);
      for (let i = 0; i < particleCount; i++) {
        pPos[i * 3] = (Math.random() - 0.5) * 70;
        pPos[i * 3 + 1] = Math.random() * 16 + 1;
        pPos[i * 3 + 2] = (Math.random() - 0.5) * 70;
      }
      const pGeo = new THREE.BufferGeometry();
      pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
      particles = new THREE.Points(
        pGeo,
        new THREE.PointsMaterial({
          color: 0xa8c4e0,
          size: 0.08,
          transparent: true,
          opacity: 0.26,
          depthWrite: false,
          sizeAttenuation: true,
        })
      );
      scene.add(particles);
    }

    const islandGroups = [];
    const pickRoots = [];
    let treasure = null;
    for (const cfg of ISLANDS) {
      const g = buildIsland(cfg);
      scene.add(g);
      islandGroups.push(g);
      pickRoots.push(g);
      if (cfg.id === 'mep') treasure = makeTreasure(g);
    }

    // --- UI ---
    const popupEl = document.getElementById('popup');
    const titleEl = document.getElementById('popup-title');
    const bodyEl = document.getElementById('popup-body');
    const closeBtn = popupEl.querySelector('.close');
    const dock = document.getElementById('dock');
    const perfEl = document.getElementById('perf');
    const islandById = Object.fromEntries(ISLANDS.map((d) => [d.id, d]));

    function setActiveButton(id) {
      const buttons = dock.querySelectorAll('button');
      for (let i = 0; i < buttons.length; i++) {
        buttons[i].classList.toggle('active', buttons[i].dataset.id === id);
      }
    }

    function showIslandPopup(id, extra) {
      const c = islandById[id];
      if (!c) return;
      titleEl.textContent = c.name;
      bodyEl.textContent = extra ? `${extra}——${c.body}` : c.body;
      popupEl.style.setProperty('--accent', c.accent);
      popupEl.classList.add('open');
      setActiveButton(id);
    }

    function hidePopup() {
      popupEl.classList.remove('open');
    }

    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      hidePopup();
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') hidePopup();
    });

    const overviewBtn = document.createElement('button');
    overviewBtn.type = 'button';
    overviewBtn.dataset.id = 'overview';
    overviewBtn.textContent = '總覽';
    overviewBtn.addEventListener('click', () => flyTo('overview'));
    dock.appendChild(overviewBtn);
    for (const cfg of ISLANDS) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.id = cfg.id;
      btn.textContent = cfg.name;
      btn.style.setProperty('--accent', cfg.accent);
      btn.addEventListener('click', () => {
        flyTo(cfg.id);
        showIslandPopup(cfg.id);
      });
      dock.appendChild(btn);
    }
    setActiveButton('overview');

    // --- Camera tween (preallocated) ---
    const flyStartPos = new THREE.Vector3();
    const flyEndPos = new THREE.Vector3();
    const flyStartTarget = new THREE.Vector3();
    const flyEndTarget = new THREE.Vector3();
    const FLY_OFFSET = new THREE.Vector3(7.5, 5.4, 8.6);
    let flying = false;
    let flyT = 0;
    const FLY_DUR = 1.25;

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function flyTo(id) {
      flyStartPos.copy(camera.position);
      flyStartTarget.copy(controls.target);
      if (id === 'overview') {
        flyEndPos.copy(OVERVIEW_POS);
        flyEndTarget.copy(OVERVIEW_TARGET);
        setActiveButton('overview');
      } else {
        const cfg = islandById[id];
        if (!cfg) return;
        flyEndTarget.set(cfg.x, 1.2, cfg.z);
        flyEndPos.set(cfg.x + FLY_OFFSET.x, 1.2 + FLY_OFFSET.y, cfg.z + FLY_OFFSET.z);
        setActiveButton(id);
      }
      flyT = 0;
      flying = true;
      controls.enabled = false;
    }

    // --- Raycasting ---
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let pointerDown = null;

    function setPointer(event) {
      const rect = renderer.domElement.getBoundingClientRect();
      const src = event.changedTouches && event.changedTouches[0]
        ? event.changedTouches[0]
        : event;
      const cx = src.clientX;
      const cy = src.clientY;
      if (cx == null) return false;
      pointer.x = ((cx - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((cy - rect.top) / rect.height) * 2 + 1;
      return true;
    }

    function hitIsland() {
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(pickRoots, true);
      for (const h of hits) {
        let o = h.object;
        while (o) {
          if (o.userData && o.userData.islandId) return o.userData.islandId;
          o = o.parent;
        }
      }
      return null;
    }

    function onPointerDown(e) {
      if (!setPointer(e)) return;
      pointerDown = { x: pointer.x, y: pointer.y, t: performance.now() };
    }

    function onPointerUp(e) {
      if (!pointerDown) return;
      if (!setPointer(e)) {
        pointerDown = null;
        return;
      }
      const dx = pointer.x - pointerDown.x;
      const dy = pointer.y - pointerDown.y;
      const moved = Math.hypot(dx, dy) > 0.02;
      const quick = performance.now() - pointerDown.t < 450;
      pointerDown = null;
      if (moved || !quick) return;
      const id = hitIsland();
      if (id) showIslandPopup(id);
      else hidePopup();
    }

    renderer.domElement.addEventListener('pointerdown', onPointerDown, { passive: true });
    renderer.domElement.addEventListener('pointerup', onPointerUp, { passive: true });

    function onResize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    window.addEventListener('resize', onResize, { passive: true });

    // --- Animate ---
    const clock = new THREE.Clock();
    const perfEvery = 30;
    let frame = 0;
    let lastDrawCalls = 0;
    let ready = false;

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;

      for (let i = 0; i < islandGroups.length; i++) {
        const g = islandGroups[i];
        const ph = ISLANDS[i].phase;
        g.position.y = Math.sin(t * 0.55 + ph) * 0.38;
        g.rotation.y = Math.sin(t * 0.12 + ph) * 0.025;
      }

      if (flying) {
        flyT += dt / FLY_DUR;
        const k = easeInOutCubic(Math.min(flyT, 1));
        camera.position.lerpVectors(flyStartPos, flyEndPos, k);
        controls.target.lerpVectors(flyStartTarget, flyEndTarget, k);
        if (flyT >= 1) {
          camera.position.copy(flyEndPos);
          controls.target.copy(flyEndTarget);
          flying = false;
          controls.enabled = true;
        }
      }

      stars.rotation.y = t * 0.008;
      stars.material.opacity = 0.72 + Math.sin(t * 1.4) * 0.1 + Math.sin(t * 2.7) * 0.06;
      sky.rotation.y = t * 0.003;

      if (particles) {
        particles.rotation.y = t * 0.01;
      }

      if (treasure) {
        const pulse = 0.35 + Math.sin(t * 2.2) * 0.2;
        goldMat.emissiveIntensity = 0.4 + pulse * 0.4;
        goldCoreMat.emissiveIntensity = 0.3 + pulse * 0.3;
        treasure.rotation.z = 0.25 + Math.sin(t * 0.9) * 0.08;
      }

      controls.update();
      renderer.render(scene, camera);

      frame++;
      if (frame === 1 || frame % perfEvery === 0) {
        lastDrawCalls = renderer.info.render.calls;
        perfEl.textContent = 'draws: ' + lastDrawCalls;
        ready = true;
      }
    }
    animate();

    window.__BIM_ISLANDS = {
      get ready() { return ready; },
      flyTo,
      hidePopup,
      showIslandPopup,
      getDrawCalls() { return lastDrawCalls || renderer.info.render.calls; },
      names: ISLANDS.map((d) => d.name),
      ids: ISLANDS.map((d) => d.id),
    };
  </script>
</body>
</html>
