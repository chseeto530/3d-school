<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="icon" href="data:," />
  <title>BIM 群島探索遊戲</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #071422;
      color: #f5f7fa;
      font-family: "PingFang HK", "Noto Sans TC", "Microsoft JhengHei",
        "WenQuanYi Micro Hei", "Droid Sans Fallback", "Helvetica Neue", Arial, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    #view { position: fixed; inset: 0; }
    #view canvas { display: block; width: 100%; height: 100%; }

    #hud {
      position: fixed;
      top: 8px;
      left: 8px;
      right: 8px;
      z-index: 18;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      pointer-events: none;
    }
    .pill {
      background: rgba(12, 22, 40, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.02em;
      line-height: 1.35;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    }
    #hud-title { color: #9ff6ee; }

    #hint {
      position: fixed;
      left: 132px;
      right: 12px;
      bottom: 22px;
      z-index: 12;
      text-align: center;
      font-size: 13px;
      line-height: 1.45;
      color: #f5f7fa;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7);
      pointer-events: none;
    }

    #joy {
      position: fixed;
      left: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom));
      width: 112px;
      height: 112px;
      border-radius: 50%;
      z-index: 16;
      background: rgba(10, 20, 36, 0.42);
      border: 2px solid rgba(255, 255, 255, 0.2);
      touch-action: none;
    }
    #joy-knob {
      position: absolute;
      left: 36px;
      top: 36px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(78, 214, 204, 0.92);
      box-shadow: 0 0 16px rgba(78, 214, 204, 0.45);
    }

    #quiz, #done {
      position: fixed;
      left: 50%;
      top: 108px;
      transform: translateX(-50%) translateY(-8px);
      z-index: 26;
      width: min(460px, calc(100vw - 20px));
      max-height: calc(100dvh - 150px);
      overflow: auto;
      padding: 18px 16px 16px;
      border-radius: 14px;
      background: rgba(12, 22, 40, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.45);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    #quiz.open, #done.open {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }
    #quiz::before, #done::before {
      content: "";
      position: absolute;
      top: 0; left: 16px; right: 16px;
      height: 3px;
      border-radius: 0 0 3px 3px;
      background: #4ecdc4;
    }
    #done::before { background: #f5c542; }
    .theme {
      color: #7ef0ea;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      margin: 0 32px 6px 0;
    }
    #quiz h2, #done h2 {
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.45;
      margin: 0 32px 12px 0;
    }
    #done p { color: #f5f7fa; font-size: 14px; line-height: 1.6; margin-bottom: 12px; }
    .x, #done-close {
      position: absolute;
      top: 10px; right: 10px;
      width: 32px; height: 32px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
    }
    #done-close {
      position: static;
      width: auto;
      height: 36px;
      padding: 0 14px;
      font-size: 14px;
      font-weight: 700;
    }
    .choices { display: flex; flex-direction: column; gap: 8px; }
    .choices button {
      text-align: left;
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.06);
      color: #f5f7fa;
      font: inherit;
      font-size: 15px;
      line-height: 1.45;
      cursor: pointer;
    }
    .choices button:active { background: rgba(255, 255, 255, 0.14); }
    .choices button.bad {
      border-color: #ff5c6a;
      background: rgba(160, 32, 48, 0.45);
    }

    #warn {
      position: fixed;
      top: 54px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      max-width: calc(100vw - 24px);
      padding: 10px 16px;
      border-radius: 12px;
      background: rgba(92, 12, 24, 0.94);
      border: 1px solid #ff5a6a;
      color: #ffe4e8;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.04em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s linear;
    }
    #warn.show { opacity: 1; }
    #flash {
      position: fixed;
      inset: 0;
      z-index: 24;
      pointer-events: none;
      box-shadow: inset 0 0 0 0 rgba(255, 30, 50, 0);
      transition: box-shadow 0.08s linear;
    }
    #flash.show { box-shadow: inset 0 0 90px 28px rgba(255, 32, 54, 0.62); }
  </style>
  <script>console.info('isl4');</script>
</head>
<body>
  <div id="view"></div>
  <header id="hud">
    <div class="pill" id="hud-title">BIM 群島探索遊戲</div>
    <div class="pill" id="hud-count">已組裝 0/10</div>
    <div class="pill" id="hud-next">島 1 · 原本 BIM 島</div>
  </header>
  <p id="hint">WASD 或左下搖桿移動，拖曳畫面轉向。走到解鎖島上的 BIM 藍圖。</p>
  <div id="joy" aria-hidden="true"><div id="joy-knob"></div></div>
  <div id="flash"></div>
  <div id="warn" role="alert">答錯了，請再試一次</div>
  <div id="quiz" role="dialog" aria-modal="true">
    <button type="button" class="x" id="quiz-x" aria-label="關閉">×</button>
    <p class="theme" id="quiz-theme"></p>
    <h2 id="quiz-q"></h2>
    <div class="choices" id="quiz-choices"></div>
  </div>
  <div id="done" role="dialog" aria-modal="true">
    <h2>組裝完成</h2>
    <p>十件構件已在主島中央組裝完成。</p>
    <button type="button" id="done-close">關閉</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
  import * as THREE from 'three';

  const QUIZ = [
    {
      name: '原本 BIM 島',
      question: 'BIM 同一般 3D 模型最主要分別係？',
      options: ['只係畫面更精美', '模型元件帶有可查詢、可共用的工程資料', '一定要用虛擬實境先叫 BIM'],
      answer: '模型元件帶有可查詢、可共用的工程資料',
    },
    {
      name: '長脊',
      question: 'LOD 主要用來說明咩？',
      options: ['工地午飯時段', '模型在某階段應有的詳細同可靠程度', '外牆油漆顏色編號清單'],
      answer: '模型在某階段應有的詳細同可靠程度',
    },
    {
      name: '雙峰',
      question: '碰撞檢測主要想搵出咩問題？',
      options: ['預算有冇超支', '管線、結構或建築元件喺空間上互相干擾', '工人出勤率'],
      answer: '管線、結構或建築元件喺空間上互相干擾',
    },
    {
      name: '梯田',
      question: '4D BIM 嘅「第 4 維」通常係指？',
      options: ['顏色', '時間／工期', '天氣'],
      answer: '時間／工期',
    },
    {
      name: '新月',
      question: 'MEP 通常包括邊類系統？',
      options: ['只包括園林樹木', '機電設備，例如給排水、空調通風、電氣', '只包括地基樁'],
      answer: '機電設備，例如給排水、空調通風、電氣',
    },
    {
      name: '尖塔',
      question: '5D BIM 通常在 4D 之上再加入邊項？',
      options: ['氣味', '成本／工程量', '衛星定位'],
      answer: '成本／工程量',
    },
    {
      name: '平台',
      question: '設施管理用 BIM，最常需要邊類資料？',
      options: ['設備位置、型號同保養資訊', '只需要概念草圖', '只需要廣告短片'],
      answer: '設備位置、型號同保養資訊',
    },
    {
      name: '環礁',
      question: '在 BIM 做永續分析，常見用途係？',
      options: ['比較朝向、遮陽或系統對能耗的影響', '計算廣告點擊率', '取代全部現場環保檢測'],
      answer: '比較朝向、遮陽或系統對能耗的影響',
    },
    {
      name: '裂崖',
      question: '用 BIM 做安全預演，主要想發現咩？',
      options: ['潛在的高處、吊運或動線衝突風險', '員工午餐喜好', '股票走勢'],
      answer: '潛在的高處、吊運或動線衝突風險',
    },
    {
      name: '群島',
      question: '共同數據環境（CDE）最主要作用係？',
      options: ['提供約定的共用平台，管理模型版本同權限', '只用來備份私人相片', '取代所有專業判斷'],
      answer: '提供約定的共用平台，管理模型版本同權限',
    },
  ];
  if (QUIZ.length !== 10) throw new Error('quiz');
  for (let i = 0; i < 10; i++) {
    if (QUIZ[i].options.length !== 3 || QUIZ[i].options.indexOf(QUIZ[i].answer) < 0) {
      throw new Error('quiz ' + i);
    }
  }

  const MAIN_R = 30;
  const SMALL_R = 10;
  const ORBIT = 100;
  const BODY = 0.42;
  const SHIELD_R = 12.4;
  const NEAR2 = 8.2 * 8.2;
  const SPEED = 11;
  const CAM_DIST = 20;
  const CAM_SHOULDER = 3.1;
  const CAM_AHEAD = 6.5;
  const BG = 0x071422;

  const PART_HEX = [0x3ecfc0, 0xf0a04b, 0x8fb0ff, 0x8de09a, 0x5ad7e5, 0xf5d76e, 0xc9b6ff, 0x5dcaa5, 0xff8b6a, 0xffc2d4];
  const DOCK = [
    [0, 0.28, 0],
    [0, 4.55, -0.3],
    [0, 2.33, -1.5],
    [0, 0.34, 5.22],
    [0, 2.2, 1.55],
    [0, 5.86, -0.3],
    [0, 4.26, -0.3],
    [0, 4.85, -0.3],
    [0, 1.25, -3.35],
    [0, 4.64, 1.2],
  ];

  const hudCount = document.getElementById('hud-count');
  const hudNext = document.getElementById('hud-next');
  const hintEl = document.getElementById('hint');
  const quizEl = document.getElementById('quiz');
  const quizTheme = document.getElementById('quiz-theme');
  const quizQ = document.getElementById('quiz-q');
  const quizChoices = document.getElementById('quiz-choices');
  const warnEl = document.getElementById('warn');
  const flashEl = document.getElementById('flash');
  const doneEl = document.getElementById('done');
  const joyEl = document.getElementById('joy');
  const knobEl = document.getElementById('joy-knob');

  const coarse0 = matchMedia('(pointer: coarse)').matches || window.innerWidth < 820;
  const renderer = new THREE.WebGLRenderer({
    antialias: !coarse0,
    alpha: false,
    powerPreference: 'high-performance',
    stencil: false,
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, coarse0 ? 1.25 : 1.5));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(BG, 1);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = false;
  document.getElementById('view').appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(BG);
  scene.fog = new THREE.Fog(BG, 210, 520);
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / Math.max(1, window.innerHeight), 0.12, 600);

  scene.add(new THREE.AmbientLight(0xc5d4ea, 0.78));
  const sun = new THREE.DirectionalLight(0xfff3dd, 1.35);
  sun.position.set(48, 86, 26);
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0x8fb4d8, 0.38);
  fill.position.set(-36, 24, -18);
  scene.add(fill);

  const starN = 420;
  const starArr = new Float32Array(starN * 3);
  for (let i = 0; i < starN; i++) {
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(0.05 + Math.random() * 0.95);
    const r = 200 + Math.random() * 90;
    starArr[i * 3] = r * Math.sin(ph) * Math.cos(th);
    starArr[i * 3 + 1] = Math.abs(r * Math.cos(ph)) * 0.55 + 8;
    starArr[i * 3 + 2] = r * Math.sin(ph) * Math.sin(th);
  }
  const starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(starArr, 3));
  scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({
    color: 0xd7e4ff, size: 1.15, transparent: true, opacity: 0.85, depthWrite: false, fog: false,
  })));

  const water = new THREE.Mesh(
    new THREE.CircleGeometry(250, 40),
    new THREE.MeshBasicMaterial({ color: 0x0e4a68 })
  );
  water.rotation.x = -Math.PI / 2;
  water.position.y = -2.6;
  scene.add(water);

  const unitBox = new THREE.BoxGeometry(1, 1, 1);
  const mainGeo = new THREE.CylinderGeometry(MAIN_R, 22, 8, 10);
  const smallGeo = new THREE.CylinderGeometry(SMALL_R, 7.1, 4.6, 8);
  const mainMat = new THREE.MeshLambertMaterial({ color: 0x2f8f72, flatShading: true });
  const main = new THREE.Mesh(mainGeo, mainMat);
  main.position.y = -4;
  scene.add(main);
  const plaza = new THREE.Mesh(
    new THREE.CircleGeometry(7.2, 22),
    new THREE.MeshLambertMaterial({ color: 0x4d7c86, flatShading: true })
  );
  plaza.rotation.x = -Math.PI / 2;
  plaza.position.y = 0.025;
  scene.add(plaza);

  const partMats = PART_HEX.map((hex) => {
    const color = new THREE.Color(hex);
    const emissive = color.clone().multiplyScalar(0.38);
    return new THREE.MeshLambertMaterial({ color, emissive, flatShading: true });
  });

  const ISLANDS = [];
  for (let i = 0; i < 10; i++) {
    const ang = -Math.PI / 2 + i * (Math.PI * 2 / 10);
    ISLANDS.push({
      i, ang,
      x: Math.cos(ang) * ORBIT,
      z: Math.sin(ang) * ORBIT,
      unlocked: i === 0,
      solved: false,
    });
  }

  const labelFont = '"PingFang HK","Noto Sans TC","Microsoft JhengHei","WenQuanYi Micro Hei","Droid Sans Fallback",sans-serif';
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function makeLabel(n, name, hex) {
    const c = document.createElement('canvas');
    c.width = 512;
    c.height = 256;
    const g = c.getContext('2d');
    g.clearRect(0, 0, 512, 256);
    g.fillStyle = 'rgba(6, 14, 28, 0.62)';
    roundRect(g, 24, 36, 464, 184, 28);
    g.fill();
    g.strokeStyle = '#' + hex.toString(16).padStart(6, '0');
    g.lineWidth = 8;
    g.stroke();
    g.fillStyle = '#ffffff';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.font = '800 86px ' + labelFont;
    g.fillText(String(n), 256, 98);
    g.fillStyle = '#d9fff8';
    g.font = '650 40px ' + labelFont;
    g.fillText(name, 256, 162);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, fog: false }));
    s.scale.set(8.4, 4.2, 1);
    s.renderOrder = 3;
    return s;
  }

  const crystalGeo = new THREE.ConeGeometry(0.72, 2.5, 5);
  for (let i = 0; i < 10; i++) {
    const isl = ISLANDS[i];
    const top = new THREE.MeshLambertMaterial({
      color: new THREE.Color().setHSL(0.40 + i * 0.045, 0.46, 0.36),
      flatShading: true,
    });
    const mesh = new THREE.Mesh(smallGeo, top);
    mesh.position.set(isl.x, -2.3, isl.z);
    scene.add(mesh);
    const label = makeLabel(i + 1, QUIZ[i].name, PART_HEX[i]);
    label.position.set(isl.x, 6.4, isl.z);
    scene.add(label);
    const ca = isl.ang + (i === 2 ? 0.85 : 0.7);
    const crystal = new THREE.Mesh(i === 1 ? unitBox : crystalGeo, partMats[i]);
    crystal.position.set(isl.x + Math.cos(ca) * 6.3, 1.2, isl.z + Math.sin(ca) * 6.3);
    if (i === 1) crystal.scale.set(1.1, 0.55, 3.6);
    else crystal.scale.y = 0.75 + (i % 4) * 0.28;
    crystal.rotation.y = isl.ang;
    scene.add(crystal);
    if (i === 2) {
      const c2 = new THREE.Mesh(crystalGeo, partMats[i]);
      const a2 = isl.ang - 0.85;
      c2.position.set(isl.x + Math.cos(a2) * 6.2, 1.85, isl.z + Math.sin(a2) * 6.2);
      c2.scale.y = 1.45;
      scene.add(c2);
    }
  }

  const domeGeo = new THREE.SphereGeometry(11.6, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2);
  const domeMat = new THREE.MeshBasicMaterial({
    color: 0xff2d3a, transparent: true, opacity: 0.4, depthWrite: false, fog: false,
  });
  const shieldRingGeo = new THREE.TorusGeometry(11.35, 0.26, 5, 22);
  const shieldRingMat = new THREE.MeshBasicMaterial({
    color: 0xff4d58, transparent: true, opacity: 0.95, depthWrite: false, fog: false,
  });
  const shields = new Array(10).fill(null);
  const fading = [];
  for (let i = 1; i < 10; i++) {
    const g = new THREE.Group();
    const dome = new THREE.Mesh(domeGeo, domeMat);
    dome.renderOrder = 1;
    const ring = new THREE.Mesh(shieldRingGeo, shieldRingMat);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.22;
    ring.renderOrder = 1;
    g.add(dome, ring);
    g.position.set(ISLANDS[i].x, 0.05, ISLANDS[i].z);
    g.userData.k = 1;
    scene.add(g);
    shields[i] = g;
  }
  function dismissShield(i) {
    const s = shields[i];
    if (!s || s.userData.bye) return;
    s.userData.bye = true;
    fading.push(s);
  }

  const bridgeGeo = new THREE.BoxGeometry(3.5, 0.16, 66);
  const bridgeMat = new THREE.MeshLambertMaterial({ color: 0xbaf7ef, emissive: 0x146860, flatShading: true });
  const bridges = [];
  for (let i = 0; i < 10; i++) {
    const b = new THREE.Mesh(bridgeGeo, bridgeMat);
    const ang = ISLANDS[i].ang;
    b.position.set(Math.cos(ang) * 60, 0.1, Math.sin(ang) * 60);
    b.rotation.y = Math.PI / 2 - ang;
    b.userData.g = i === 0 ? 1 : 0;
    b.scale.z = i === 0 ? 1 : 0.02;
    b.visible = i === 0;
    scene.add(b);
    bridges.push(b);
  }

  function onBridge(x, z, ang) {
    const ux = Math.cos(ang);
    const uz = Math.sin(ang);
    const radial = x * ux + z * uz;
    const side = x * (-uz) + z * ux;
    return radial >= 26.2 && radial <= 93.8 && side <= 1.65 && side >= -1.65;
  }
  function shieldBlocks(x, z) {
    for (let i = 0; i < 10; i++) {
      if (ISLANDS[i].unlocked) continue;
      const dx = x - ISLANDS[i].x;
      const dz = z - ISLANDS[i].z;
      if (dx * dx + dz * dz < SHIELD_R * SHIELD_R) return true;
    }
    return false;
  }
  function canWalk(x, z) {
    if (shieldBlocks(x, z)) return false;
    const lim = MAIN_R - BODY;
    if (x * x + z * z <= lim * lim) return true;
    const slim = SMALL_R - BODY;
    for (let i = 0; i < 10; i++) {
      if (!ISLANDS[i].unlocked) continue;
      const dx = x - ISLANDS[i].x;
      const dz = z - ISLANDS[i].z;
      if (dx * dx + dz * dz <= slim * slim) return true;
      if (onBridge(x, z, ISLANDS[i].ang)) return true;
    }
    return false;
  }
  for (let z = 20; z >= -100; z -= 1) {
    if (!canWalk(0, z)) throw new Error('path ' + z);
  }

    const locked = movementLocked();
    if (!locked) {
      if (down.q) yaw += dt * 1.7;

    let inS = 0;

    const moving = mag > 0.08;

      const mx = rx * inS + fx * inF;
      const mz = rz * inS + fz * inF;
      const nx = boy.position.x + mx * SPEED * dt;
      const nz = boy.position.z + mz * SPEED * dt;
      if (canWalk(nx, nz)) {
        boy.position.x = nx;
        boy.position.z = nz;
      } else if (canWalk(nx, boy.position.z)) {

      } else if (canWalk(boy.position.x, nz)) {
        boy.position.z = nz;
      }
      const target = Math.atan2(mx, mz);
      const d = Math.atan2(Math.sin(target - boy.rotation.y), Math.cos(target - boy.rotation.y));
      boy.rotation.y += d * Math.min(1, dt * 12);
      walk += dt * 11;
      const sw = Math.sin(walk);
      legL.rotation.x = sw * 0.9;
      legR.rotation.x = -sw * 0.9;

      legR.rotation.x += -legR.rotation.x * k;

      armR.rotation.x += -armR.rotation.x * k;
    }

      const pdx = boy.position.x - blueprint.position.x;
      const pdz = boy.position.z - blueprint.position.z;
      nearBlueprint = pdx * pdx + pdz * pdz < NEAR2;

    const bob = Math.sin(time * 2.2) * 0.08;
    board.position.y = 1.9 + bob;
    backplate.position.y = 1.9 + bob;
    glowPlane.position.y = 1.9 + bob;
    const pulse = 0.55 + Math.sin(time * 3.1) * 0.45;
    glowMat.opacity = 0.16 + pulse * 0.24;
    beaconMat.opacity = 0.1 + pulse * 0.16;

    if (arrow.visible) arrow.position.y = 18.5 + Math.sin(time * 2.7) * 1.05;

    for (let i = fading.length - 1; i >= 0; i--) {
      const s = fading[i];
      s.userData.k -= dt * 2.15;
      if (s.userData.k <= 0) {
        s.visible = false;
        fading.splice(i, 1);
      } else {
        const k = s.userData.k;
        s.scale.set(k, k, k);
      }
    }
    for (let i = 0; i < 10; i++) {
      const b = bridges[i];
      const target = ISLANDS[i].unlocked ? 1 : 0;
      if (b.userData.g === target) continue;
      b.userData.g += (target > b.userData.g ? dt : -dt) / 0.55;
      if (b.userData.g > 1) b.userData.g = 1;
      if (b.userData.g < 0) b.userData.g = 0;
      b.scale.z = b.userData.g < 0.02 ? 0.02 : b.userData.g;
      b.visible = b.userData.g > 0.02;
    }
    tickTweens(dt);

    if (cineT > 0) {
      cineT -= dt;
      if (cineT < 0) cineT = 0;
      wantX = cineX; wantY = cineY; wantZ = cineZ;
      wantLX = cineLX; wantLY = cineLY; wantLZ = cineLZ;
      if (cineT === 0) {
        if (camera.fov !== 60) {
          camera.fov = 60;
          camera.updateProjectionMatrix();
        }
        if (aimIsland >= 0) {
          const isl = ISLANDS[aimIsland];
          yaw = Math.atan2(boy.position.x - isl.x, boy.position.z - isl.z);
          boy.rotation.y = Math.atan2(isl.x - boy.position.x, isl.z - boy.position.z);
          aimIsland = -1;
        }
        if (pendingDone && tweens.length === 0) showDone();
      }
    } else {
      computeFollow();
    }
    const ck = 1 - Math.exp(-4.8 * dt);
    camera.position.x += (wantX - camera.position.x) * ck;
    camera.position.y += (wantY - camera.position.y) * ck;
    camera.position.z += (wantZ - camera.position.z) * ck;
    camera.lookAt(wantLX, wantLY, wantLZ);
    if (shakeT > 0) {
      shakeT -= dt;
      if (shakeT < 0) shakeT = 0;
      const mag = shakeT * 1.45;
      camera.position.x += Math.sin(time * 54) * mag;
      camera.position.y += Math.cos(time * 47) * mag * 0.62;
      camera.position.z += Math.sin(time * 41) * mag * 0.45;
      camera.rotateZ(Math.sin(time * 62) * shakeT * 0.24);
    }

    let nextHint;
    if (doneShown && doneEl.classList.contains('open')) nextHint = '十件構件已在主島組裝完成';
    else if (cineT > 0) nextHint = pendingDone ? '最後一件構件飛往主島' : '構件飛往主島，黃色箭嘴指向下一座島';
    else if (quizOpen) nextHint = '選擇一個答案';
    else if (nearBlueprint) nextHint = '點擊發光的 BIM 藍圖';
    else nextHint = 'WASD 或左下搖桿移動，拖曳畫面轉向。走到解鎖島上的 BIM 藍圖。';
    setHint(nextHint);

    let st = 'play';
    if (doneEl.classList.contains('open')) st = 'done';
    else if (cineT > 0) st = 'cine';
    else if (quizOpen) st = 'quiz';
    else if (nearBlueprint) st = 'near';
    setState(st);

    renderer.render(scene, camera);
    if (!ready) {
      ready = true;
      document.body.dataset.ready = '1';
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  </script>
</body>
</html>
